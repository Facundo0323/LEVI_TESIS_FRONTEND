<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Máscara para bordes redondeados -->
    <clipPath id="corners">
      <rect x="0" y="0" width="100" height="100" rx="20" />
    </clipPath>
  </defs>
  
  <!-- Panel de 4 colores -->
  <g clip-path="url(#corners)">
    <rect x="0" y="0" width="50" height="50" fill="#E53935" />   <!-- Rojo (Arriba Izquierda) -->
    <rect x="50" y="0" width="50" height="50" fill="#1E88E5" />  <!-- Azul (Arriba Derecha) -->
    <rect x="0" y="50" width="50" height="50" fill="#FDD835" />  <!-- Amarillo (Abajo Izquierda) -->
    <rect x="50" y="50" width="50" height="50" fill="#43A047" /> <!-- Verde (Abajo Derecha) -->
  </g>
  
  <!-- Ojo minimalista -->
  <path d="M 15 50 Q 50 15 85 50 Q 50 85 15 50 Z" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="14" fill="none" stroke="#FFFFFF" stroke-width="8" />
</svg>